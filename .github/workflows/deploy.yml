# ABC Retail - continuous deployment to Azure App Service
# Author: Genius Mhirizhonga
# Module: CLDV7112 - Cloud Development B

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: st10541838
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: src/ABCRetail.Web/ABCRetail.Web.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./publish

      # The storage key is not needed here. It is held as an App Service application
      # setting, so the deployed build reads it from the environment at start up.
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      # The original hostname is kept in service because the Task 1 and Task 2
      # submissions link to it, so both sites are deployed from the same build.
      - name: Deploy to the original hostname
        uses: azure/webapps-deploy@v3
        with:
          app-name: abcretail-gm-cldv7112
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_LEGACY }}
          package: ./publish
